# llm-proxy 配置示例

# 远程暴露管理服务时建议通过环境变量配置独立密钥。
# 设置后管理 API 需要 Authorization: Bearer 或 x-api-key；GET /admin 页面外壳保持公开。
# macOS App 可通过短期、单次交接码把密钥安全导入 HTTPS 或本机 Web UI。
admin_key: ${ADMIN_KEY}

providers:
  # Anthropic (原生 Messages API) — 启用 thinking 模式
  - name: anthropic-main
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    models:
      - id: claude-sonnet-4-20250514
        thinking:
          budget_tokens: 8192          # 启用 thinking，设置 token 预算
      - id: claude-3-haiku-20240307     # 无 thinking 配置，使用默认行为

  # OpenAI (Chat Completions API) — 设置 reasoning_effort
  - name: openai-main
    type: openai
    api_key: ${OPENAI_API_KEY}
    models:
      - id: o3-mini
        reasoning_effort: medium       # low | medium | high
      - id: gpt-4o

  # OpenAI 兼容协议 (如 DeepSeek, Groq 等)
  - name: deepseek
    type: openai
    api_key: ${DEEPSEEK_API_KEY}
    api_base: https://api.deepseek.com
    models:
      - id: deepseek-chat

  # OpenAI Responses API
  - name: openai-responses
    type: openai-responses
    api_key: ${OPENAI_API_KEY}
    models:
      - id: o3-mini
        reasoning_effort: high

  # 同一供应商支持多个协议时，使用 protocols 配置各协议的 API Base，
  # 并在模型上通过 protocol 指定实际使用的协议。
  - name: multi-protocol-provider
    api_key: ${MULTI_PROTOCOL_API_KEY}
    protocols:
      - type: openai
        api_base: https://gateway.example.com/openai
      - type: anthropic
        api_base: https://gateway.example.com/anthropic
    models:
      - id: chat-model
        protocols: [openai, anthropic]
      - id: messages-model
        protocols: [anthropic]
