name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm publish
        # prepublishOnly 自动执行 build + test
        # npm CLI ≥11.5.1 在 GitHub Actions 中自动使用 OIDC trusted publishing
