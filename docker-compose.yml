# llm-proxy P0 的 docker-compose 文件。
#
# 这里只定义 app 服务；数据库假定宿主机上已存在名为 `postgres` 的同级容器，
# 通过外部 bridge 网络 `shared-net` 以 DNS 名 `postgres` 访问。
# 首次创建 llmproxy_dev 数据库请执行 scripts/init-db.sh。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proxy:local
    container_name: llm-proxy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 9000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-llmproxy_dev}
      PROXY_KEY: ${PROXY_KEY:-}
    ports:
      - "9000:9000"
    networks:
      - shared-net

networks:
  shared-net:
    external: true
